name = "the-ceo-vault"
compatibility_date = "2026-08-21"
pages_build_output_dir = "dist"

[vars]
VITE_DEFAULT_GAME_VERSION = "2K27"
VITE_APP_ENV = "production"
VITE_APP_NAME = "THE CEO VAULT"

# Note: The following secrets must be set via `wrangler pages secret put` or Cloudflare Dashboard:
# - STRIPE_WEBHOOK_SECRET
# - SUPABASE_SERVICE_ROLE_KEY
# - DISCORD_BOT_TOKEN
# - DISCORD_GUILD_ID
# - INTERNAL_API_SECRET
